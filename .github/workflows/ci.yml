name: CI

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
  schedule:
    - cron: '0 15 * * 5'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '4.0'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
      - name: Run tests
        run: KUBECONFIG="$HOME/.kube/config" bundle exec rake spec

  build:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ruby
      - uses: release-gems/action/build@v1.2.1
        with:
          sandbox: true

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    environment: rubygems.org
    runs-on: ubuntu-slim
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: release-gems/action@v1.2.1
